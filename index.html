<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Generador de Vales de Servicio | Alineaciones Bustamante</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logooriginal.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Estilos de botones de radio gigantes */
    .radio-card input:checked + .radio-content {
      border-color: #2563eb !important;
      background-color: #eff6ff !important;
      color: #1e3a8a !important;
      font-weight: 700 !important;
      box-shadow: 0 0 0 2px #2563eb !important;
    }
    /* SweetAlert2 Adaptado */
    .swal2-popup-accessible {
      border-radius: 1.5rem !important;
      padding: 2rem !important;
      width: 92% !important;
      max-width: 480px !important;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen flex flex-col justify-between p-3 sm:p-6 antialiased text-slate-900">

  <!-- Contenedor Principal con alto contraste -->
  <div class="max-w-2xl mx-auto w-full bg-white rounded-3xl shadow-2xl border-2 border-slate-200 overflow-hidden my-auto">
    
    <!-- Encabezado Claro -->
    <div class="bg-slate-900 text-white p-5 sm:p-7 border-b-4 border-blue-600">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center space-x-4 text-center sm:text-left">
          <img src="logooriginal.png" alt="Logo" class="h-12 w-auto object-contain bg-white p-1 rounded-lg" onerror="this.style.display='none'">
          <div>
            <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight">Alineaciones Bustamante</h1>
            <p class="text-sm font-medium text-slate-300 mt-0.5">Ingreso de Nuevo Vale</p>
          </div>
        </div>

        <a href="informe-alineacion.html">
          <button type="button">Informe de Alineación</button>
        </a>

        <a href="admin.html" class="w-full sm:w-auto text-center px-4 py-2.5 text-xs font-bold text-slate-200 bg-slate-800 border-2 border-slate-700 rounded-xl hover:bg-slate-700 hover:text-white transition-all">
          ⚙️ Panel Administrador
        </a>
      </div>
    </div>

    <!-- Formulario Simplificado -->
    <form id="formVale" class="p-5 sm:p-8 space-y-7">

      <!-- PASO 1: Empresa -->
      <div>
        <label class="block text-base font-extrabold text-slate-900 mb-2">
          1. Selecciona la Empresa o Cliente <span class="text-red-500">*</span>
        </label>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
          
          <label class="radio-card cursor-pointer">
            <input type="radio" name="empresa_option" value="Baudet" class="sr-only">
            <div class="radio-content p-3.5 rounded-xl border-2 border-slate-300 text-center text-sm font-semibold text-slate-700 transition-all">
              Baudet
            </div>
          </label>

          <label class="radio-card cursor-pointer">
            <input type="radio" name="empresa_option" value="Arvi" class="sr-only">
            <div class="radio-content p-3.5 rounded-xl border-2 border-slate-300 text-center text-sm font-semibold text-slate-700 transition-all">
              Arvi
            </div>
          </label>

          <label class="radio-card cursor-pointer">
            <input type="radio" name="empresa_option" value="Incubo" class="sr-only">
            <div class="radio-content p-3.5 rounded-xl border-2 border-slate-300 text-center text-sm font-semibold text-slate-700 transition-all">
              Incubo
            </div>
          </label>

          <label class="radio-card cursor-pointer">
            <input type="radio" name="empresa_option" value="Suarez" class="sr-only">
            <div class="radio-content p-3.5 rounded-xl border-2 border-slate-300 text-center text-sm font-semibold text-slate-700 transition-all">
              Suarez
            </div>
          </label>

          <label class="radio-card cursor-pointer">
            <input type="radio" name="empresa_option" value="OD Automotriz" class="sr-only">
            <div class="radio-content p-3.5 rounded-xl border-2 border-slate-300 text-center text-sm font-semibold text-slate-700 transition-all">
              OD Automotriz
            </div>
          </label>

          <label class="radio-card cursor-pointer">
            <input type="radio" name="empresa_option" value="Particular" class="sr-only" checked>
            <div class="radio-content p-3.5 rounded-xl border-2 border-slate-300 text-center text-sm font-semibold text-slate-700 transition-all">
              Particular
            </div>
          </label>

        </div>
      </div>

      <hr class="border-slate-200">

      <!-- PASO 2: Vehículo y Patente -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="marca" class="block text-base font-extrabold text-slate-900 mb-1.5">
            2. Vehículo / Marca <span class="text-red-500">*</span>
          </label>
          <input type="text" id="marca" required placeholder="Ej: AUDI A3" class="w-full px-4 py-3.5 rounded-xl border-2 border-slate-300 focus:border-blue-600 focus:ring-0 text-base font-bold text-slate-800 placeholder-slate-400 bg-slate-50 transition-all uppercase">
        </div>

        <div>
          <label for="patente" class="block text-base font-extrabold text-slate-900 mb-1.5">
            Patente <span class="text-red-500">*</span>
          </label>
          <input type="text" id="patente" required placeholder="Ej: BBBB11" class="w-full px-4 py-3.5 rounded-xl border-2 border-slate-300 focus:border-blue-600 focus:ring-0 text-lg font-black text-blue-900 tracking-wider placeholder-slate-400 bg-slate-50 transition-all uppercase">
        </div>
      </div>

      <!-- PASO 3: Detalle del Servicio -->
      <div>
        <label for="detalle" class="block text-base font-extrabold text-slate-900 mb-1.5">
          3. ¿Qué trabajo se realizó?
        </label>
        <textarea id="detalle" rows="2" placeholder="Ej: Alineación de tren delantero..." class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 focus:ring-0 text-base font-medium text-slate-800 placeholder-slate-400 bg-slate-50 transition-all"></textarea>
      </div>

      <hr class="border-slate-200">

      <!-- PASO 4: Valores Monetarios Destacados -->
      <div class="bg-blue-50/70 p-4 sm:p-5 rounded-2xl border-2 border-blue-200 space-y-4">
        <p class="text-xs font-black uppercase text-blue-900 tracking-wide">4. Monto a Cobrar (Se calcula solo)</p>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="valor_neto" class="block text-sm font-extrabold text-slate-800 mb-1">
              Valor Neto ($)
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 font-bold text-lg">$</span>
              <input type="number" id="valor_neto" step="1" min="0" placeholder="0" class="w-full pl-8 pr-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 text-lg font-bold text-slate-900 bg-white">
            </div>
          </div>

          <div>
            <label for="valor_total" class="block text-sm font-extrabold text-blue-950 mb-1">
              Valor Total ($)
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-blue-600 font-black text-lg">$</span>
              <input type="number" id="valor_total" step="1" min="0" placeholder="0" class="w-full pl-8 pr-4 py-3 rounded-xl border-2 border-blue-400 focus:border-blue-600 text-xl font-black text-blue-900 bg-white">
            </div>
          </div>
        </div>
      </div>

      <!-- PASO 5: Medio de Pago -->
      <div>
        <label class="block text-base font-extrabold text-slate-900 mb-2">
          5. Medio de Pago <span class="text-red-500">*</span>
        </label>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
          
          <label class="radio-card cursor-pointer">
            <input type="radio" name="medio_pago" value="Efectivo" class="sr-only" checked>
            <div class="radio-content p-3 rounded-xl border-2 border-slate-300 text-center text-sm font-semibold text-slate-700 transition-all">
              💵 Efectivo
            </div>
          </label>

          <label class="radio-card cursor-pointer">
            <input type="radio" name="medio_pago" value="Tarjeta" class="sr-only">
            <div class="radio-content p-3 rounded-xl border-2 border-slate-300 text-center text-sm font-semibold text-slate-700 transition-all">
              💳 Tarjeta
            </div>
          </label>

          <label class="radio-card cursor-pointer">
            <input type="radio" name="medio_pago" value="Transferencia" class="sr-only">
            <div class="radio-content p-3 rounded-xl border-2 border-slate-300 text-center text-sm font-semibold text-slate-700 transition-all">
              📲 Transferencia
            </div>
          </label>

          <label class="radio-card cursor-pointer">
            <input type="radio" name="medio_pago" value="Credito empresa" class="sr-only">
            <div class="radio-content p-3 rounded-xl border-2 border-slate-300 text-center text-sm font-semibold text-slate-700 transition-all">
              🏢 Crédito Empresa
            </div>
          </label>
        </div>
      </div>

      <!-- Botón Principal Gigante -->
      <button type="submit" id="btnGuardar" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-black text-lg py-4 px-6 rounded-2xl shadow-xl shadow-blue-600/30 transition-all flex items-center justify-center space-x-3 touch-manipulation cursor-pointer border-b-4 border-blue-800">
        <svg class="w-7 h-7 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 002-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
        </svg>
        <span id="btnTexto">GUARDAR Y REGISTRAR VALE</span>
      </button>

    </form>
  </div>

  <p class="text-center text-xs font-bold text-slate-400 mt-6">Alineaciones Bustamante © 2026</p>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://okkydrwdexacxvfbtopb.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_XY2XRiAQw4tQdygSAwd4XA_pRETQ_EA';              
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('formVale');
    const inputNeto = document.getElementById('valor_neto');
    const inputTotal = document.getElementById('valor_total');
    const btnGuardar = document.getElementById('btnGuardar');
    const btnTexto = document.getElementById('btnTexto');

    // Cálculo automático bidireccional
    inputNeto.addEventListener('input', () => {
      const netoVal = parseFloat(inputNeto.value);
      if (!isNaN(netoVal) && netoVal > 0) {
        inputTotal.value = Math.round(netoVal * 1.19);
      } else {
        inputTotal.value = '';
      }
    });

    inputTotal.addEventListener('input', () => {
      const totalVal = parseFloat(inputTotal.value);
      if (!isNaN(totalVal) && totalVal > 0) {
        inputNeto.value = Math.round(totalVal / 1.19);
      } else {
        inputNeto.value = '';
      }
    });

    // Guardar Vale
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const empresaRadio = document.querySelector('input[name="empresa_option"]:checked');
      if (!empresaRadio) {
        Swal.fire({
          icon: 'warning',
          title: 'Falta un dato',
          text: 'Por favor selecciona la Empresa.',
          timer: 2500,
          showConfirmButton: false,
          customClass: { popup: 'swal2-popup-accessible' }
        });
        return;
      }

      btnGuardar.disabled = true;
      btnTexto.innerText = 'GUARDANDO EN LA BASE DE DATOS...';

      try {
        const datosVale = {
          nombre_empresa: empresaRadio.value,
          marca: document.getElementById('marca').value.toUpperCase().trim(),
          patente: document.getElementById('patente').value.toUpperCase().trim(),
          detalle: document.getElementById('detalle').value.trim(),
          valor_neto: parseFloat(inputNeto.value) || 0,
          valor_total: parseFloat(inputTotal.value) || 0,
          medio_pago: document.querySelector('input[name="medio_pago"]:checked').value
        };

        const { data, error } = await client
          .from('ordenes')
          .insert([datosVale])
          .select();

        if (error) throw error;

        const idGenerado = (data && data.length > 0) ? data[0].id : 'N/A';

        form.reset();

        // Alerta Clara con Letra Grande
        Swal.fire({
          icon: 'success',
          title: '¡VALE GUARDADO!',
          html: `
            <div class="text-slate-800 text-lg mt-2 font-medium">
              <p class="text-3xl font-black text-blue-600 mb-2">Folio: #${idGenerado}</p>
              <p><b>Vehículo:</b> ${datosVale.marca}</p>
              <p><b>Patente:</b> ${datosVale.patente}</p>
            </div>
          `,
          timer: 2500,
          showConfirmButton: false,
          timerProgressBar: true,
          customClass: { popup: 'swal2-popup-accessible' }
        });

      } catch (err) {
        console.error('Error:', err);
        Swal.fire({
          icon: 'error',
          title: 'Error al guardar',
          text: err.message,
          customClass: { popup: 'swal2-popup-accessible' }
        });
      } finally {
        btnGuardar.disabled = false;
        btnTexto.innerText = 'GUARDAR Y REGISTRAR VALE';
      }
    });
  </script>
</body>
</html>
