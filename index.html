<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Generador de Vales | Alineaciones Bustamante</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logooriginal.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .swal2-popup-accessible {
      border-radius: 1.5rem !important;
      padding: 2rem !important;
      width: 92% !important;
      max-width: 480px !important;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen flex flex-col justify-between p-3 sm:p-6 antialiased text-slate-900">

  <div class="max-w-2xl mx-auto w-full bg-white rounded-3xl shadow-2xl border-2 border-slate-200 overflow-hidden my-auto p-5 sm:p-8 space-y-6">
    
    <!-- Encabezado -->
    <div class="flex items-center justify-between border-b pb-5 border-slate-200">
      <div class="flex items-center space-x-3">
        <img src="logooriginal.png" alt="Logo" class="h-12 w-auto object-contain bg-white p-1 rounded-lg border border-slate-200" onerror="this.style.display='none'">
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Ingreso de Vale</h1>
          <p class="text-xs sm:text-sm font-medium text-slate-500">Alineaciones Bustamante</p>
        </div>
      </div>
      
      <a href="admin.html" class="px-3.5 py-2 text-xs font-bold text-slate-700 bg-slate-100 border border-slate-300 rounded-xl hover:bg-slate-200 transition-all flex items-center gap-1.5">
        ⚙️ Admin
      </a>
    </div>

    <!-- Formulario -->
    <form id="formVale" class="space-y-4">

      <div>
        <label for="empresa" class="block text-xs font-extrabold uppercase text-slate-700 mb-1.5">Nombre Empresa / Cliente</label>
        <input type="text" id="empresa" required placeholder="Ej: Transportes Bustamante SpA" class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 focus:ring-0 text-base font-bold text-slate-800 bg-slate-50 transition-all">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="marca" class="block text-xs font-extrabold uppercase text-slate-700 mb-1.5">Vehículo / Marca / Modelo</label>
          <input type="text" id="marca" required placeholder="Ej: Audi A3 / Volvo FH" class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 focus:ring-0 text-base font-bold uppercase text-slate-800 bg-slate-50 transition-all">
        </div>

        <div>
          <label for="patente" class="block text-xs font-extrabold uppercase text-slate-700 mb-1.5">Patente</label>
          <input type="text" id="patente" required placeholder="Ej: BB-CL-88" class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 focus:ring-0 text-base font-black uppercase text-blue-900 bg-slate-50 transition-all tracking-wider">
        </div>
      </div>

      <div>
        <label for="detalle" class="block text-xs font-extrabold uppercase text-slate-700 mb-1.5">Detalle del Servicio</label>
        <textarea id="detalle" rows="2" placeholder="Ej: Alineación de tren delantero y balanceo..." class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 focus:ring-0 text-sm font-medium text-slate-800 bg-slate-50 transition-all"></textarea>
      </div>

      <!-- Sección de Cálculo Valores -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-blue-50/70 p-4 rounded-2xl border-2 border-blue-100">
        <div>
          <label for="neto" class="block text-xs font-extrabold uppercase text-slate-800 mb-1.5">Valor Neto ($)</label>
          <input type="number" id="neto" required placeholder="0" class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 focus:ring-0 text-lg font-bold text-slate-900 bg-white transition-all">
        </div>

        <div>
          <label for="total" class="block text-xs font-extrabold uppercase text-blue-950 mb-1.5">Valor Total (Con IVA $)</label>
          <input type="number" id="total" required placeholder="0" class="w-full px-4 py-3 rounded-xl border-2 border-blue-400 focus:border-blue-600 focus:ring-0 text-lg font-black text-blue-900 bg-white transition-all">
        </div>
      </div>

      <div>
        <label for="medioPago" class="block text-xs font-extrabold uppercase text-slate-700 mb-1.5">Medio de Pago</label>
        <select id="medioPago" class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-600 focus:ring-0 text-base font-bold text-slate-800 bg-slate-50 transition-all">
          <option value="Efectivo">💵 Efectivo</option>
          <option value="Tarjeta">💳 Tarjeta (Débito/Crédito)</option>
          <option value="Transferencia">📲 Transferencia Bancaria</option>
          <option value="Credito empresa">🏢 Crédito Empresa</option>
        </select>
      </div>

      <button type="submit" id="btnGuardar" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-black text-base py-4 px-6 rounded-2xl shadow-xl shadow-blue-600/30 transition-all flex items-center justify-center space-x-2 border-b-4 border-blue-800 cursor-pointer mt-2">
        <span>REGISTRAR VALE DE SERVICIO</span>
      </button>

    </form>
  </div>

  <p class="text-center text-xs font-bold text-slate-400 mt-6 mb-2">Alineaciones Bustamante © 2026</p>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://okkydrwdexacxvfbtopb.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_XY2XRiAQw4tQdygSAwd4XA_pRETQ_EA';              
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Cálculo automático Neto / IVA
    let calculando = false;
    const netoInput = document.getElementById('neto');
    const totalInput = document.getElementById('total');

    netoInput.addEventListener('input', () => {
      if (calculando) return;
      calculando = true;
      const v = parseFloat(netoInput.value);
      totalInput.value = (!isNaN(v) && v > 0) ? Math.round(v * 1.19) : '';
      calculando = false;
    });

    totalInput.addEventListener('input', () => {
      if (calculando) return;
      calculando = true;
      const v = parseFloat(totalInput.value);
      netoInput.value = (!isNaN(v) && v > 0) ? Math.round(v / 1.19) : '';
      calculando = false;
    });

    // Envío del Formulario
    document.getElementById('formVale').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnGuardar = document.getElementById('btnGuardar');
      btnGuardar.disabled = true;
      btnGuardar.innerText = 'GUARDANDO VALE...';

      try {
        const nuevoVale = {
          nombre_empresa: document.getElementById('empresa').value.trim(),
          marca: document.getElementById('marca').value.toUpperCase().trim(),
          patente: document.getElementById('patente').value.toUpperCase().trim(),
          detalle: document.getElementById('detalle').value.trim(),
          valor_neto: parseInt(netoInput.value, 10) || 0,
          valor_total: parseInt(totalInput.value, 10) || 0,
          medio_pago: document.getElementById('medioPago').value
        };

        const { data, error } = await client
          .from('ordenes')
          .insert([nuevoVale])
          .select();

        if (error) throw error;

        // Limpiar formulario
        document.getElementById('formVale').reset();

        // Alerta con CIERRE AUTOMÁTICO (2 segundos)
        Swal.fire({
          icon: 'success',
          title: '¡Vale Registrado!',
          text: `Se ha creado correctamente el vale #${data[0].id}`,
          timer: 2000,
          timerProgressBar: true,
          showConfirmButton: false,
          customClass: { popup: 'swal2-popup-accessible' }
        });

      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Error al Registrar',
          text: err.message,
          customClass: { popup: 'swal2-popup-accessible' }
        });
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.innerText = 'REGISTRAR VALE DE SERVICIO';
      }
    });
  </script>
</body>
</html>
