  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();

      const printButton = document.getElementById("print-button");
      const detailButton = document.getElementById("detail-button");
      const detailPanel = document.getElementById("measurement-details");
      const showText = document.querySelector('[data-template-id="detail-button-show"]');
      const hideText = document.querySelector('[data-template-id="detail-button-hide"]');

      printButton.addEventListener("click", function () {
        window.print();
      });

      detailButton.addEventListener("click", function () {
        const isHidden = detailPanel.classList.toggle("detail-hidden");
        showText.classList.toggle("d-none", !isHidden);
        hideText.classList.toggle("d-none", isHidden);
        detailButton.setAttribute("aria-expanded", String(!isHidden));
      });
    });
  </script>
