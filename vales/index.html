<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador - Órdenes de Trabajo</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #334155;
    }
    .card-dashboard {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
    .table-custom th {
      background-color: #f8fafc;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 700;
      border-bottom: 2px solid #e2e8f0;
    }
    .table-custom td {
      vertical-align: middle;
      font-size: 0.875rem;
    }
    .badge-soft-success {
      background-color: #d1fae5;
      color: #065f46;
    }
    .badge-soft-primary {
      background-color: #dbeafe;
      color: #1e40af;
    }
    .badge-soft-purple {
      background-color: #f3e8ff;
      color: #6b21a8;
    }
    .row-highlight-new {
      animation: highlightFade 4s ease-out forwards;
    }
    @keyframes highlightFade {
      0% { background-color: #d1fae5; }
      100% { background-color: transparent; }
    }
    .btn-action {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- CONTENEDOR DE TOASTS (NOTIFICACIONES EN TIEMPO REAL) -->
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;">
    <div id="liveToast" class="toast align-items-center text-bg-dark border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex items-center gap-2">
          <i class="bi bi-bell-fill text-success fs-5"></i>
          <div>
            <strong class="d-block text-success-emphasis" id="toastTitle">¡Nuevo Vale!</strong>
            <span id="toastBody" class="small text-light-50">Se ha generado un nuevo registro.</span>
          </div>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- MODAL LOGIN (Muestra al inicio si no hay sesión) -->
  <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-2">
              <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h4 class="fw-bold mb-1">Acceso Administrador</h4>
            <p class="text-muted small">Ingresa tus credenciales para gestionar el sistema</p>
          </div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label text-uppercase fs-7 fw-bold text-muted">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" id="loginEmail" class="form-control border-start-0" required placeholder="admin@empresa.cl">
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label text-uppercase fs-7 fw-bold text-muted">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                <input type="password" id="loginPassword" class="form-control border-start-0" required placeholder="••••••••">
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-full py-2.5 fw-bold shadow-sm rounded-3">
              Iniciar Sesión <i class="bi bi-arrow-right ms-1"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- NAVBAR PRINCIPAL -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
    <div class="container-fluid px-md-5">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-dark" href="#">
        <span class="bg-primary text-white rounded-3 p-1.5 d-inline-flex"><i class="bi bi-receipt-cutoff"></i></span>
        <span>ControlVales <span class="badge bg-primary-subtle text-primary fs-8 font-normal ms-1">Admin</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button onclick="exportarExcel()" class="btn btn-outline-success btn-sm font-medium d-flex align-items-center gap-2 rounded-2">
          <i class="bi bi-file-earmark-spreadsheet"></i> Exportar CSV
        </button>
        <button id="btnCerrarSesion" class="btn btn-light btn-sm text-secondary font-medium d-flex align-items-center gap-1 rounded-2 border">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container-fluid px-md-5 py-4">
    
    <!-- TITULO DE PAGINA -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
      <div>
        <h3 class="fw-bold text-dark mb-0">Órdenes de Trabajo</h3>
        <p class="text-muted small mb-0">Gestión de datos y recepción en tiempo real</p>
      </div>
    </div>

    <!-- TARJETA FILTROS Y BÚSQUEDA -->
    <div class="card card-dashboard mb-4">
      <div class="card-body p-3">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label text-uppercase fs-8 font-bold text-muted mb-1">Búsqueda rápida</label>
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-search"></i></span>
              <input type="text" id="buscarGeneral" class="form-control border-start-0" placeholder="Buscar por Patente, Empresa o Detalle de trabajo...">
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label text-uppercase fs-8 font-bold text-muted mb-1">Medio de Pago</label>
            <select id="filtrarPago" class="form-select form-select-sm">
              <option value="Todos">Todos los métodos</option>
              <option value="Efectivo">Efectivo</option>
              <option value="Tarjeta">Tarjeta</option>
              <option value="Transferencia">Transferencia</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- TABLA PRINCIPAL DE DATOS -->
    <div class="card card-dashboard overflow-hidden">
      <div class="table-responsive">
        <table class="table table-custom table-hover align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" class="ps-3">Folio</th>
              <th scope="col">Fecha</th>
              <th scope="col">Empresa / Vehículo</th>
              <th scope="col">Detalle</th>
              <th scope="col">Neto</th>
              <th scope="col">Total</th>
              <th scope="col">Pago</th>
              <th scope="col" class="text-end pe-3">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaBody">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SCRIPT LÓGICA SUPABASE -->
  <script>
    const SUPABASE_URL = "https://okkydrwdexacxvfbtopb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XY2XRiAQw4tQdygSAwd4XA_pRETQ_EA";

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let listaOrdenes = [];
    let idEditandoActualmente = null;
    let idNuevoValeReciente = null;

    // Componentes Bootstrap Modales y Toasts
    let bsLoginModal;
    let bsToast;

    const loginForm = document.getElementById('loginForm');
    const btnCerrarSesion = document.getElementById('btnCerrarSesion');
    const tablaBody = document.getElementById('tablaBody');
    const buscarGeneralInput = document.getElementById('buscarGeneral');
    const filtrarPagoSelect = document.getElementById('filtrarPago');

    document.addEventListener('DOMContentLoaded', () => {
      bsLoginModal = new bootstrap.Modal(document.getElementById('loginModal'));
      bsToast = new bootstrap.Toast(document.getElementById('liveToast'), { delay: 4000 });

      verificarSesion();

      if (buscarGeneralInput) buscarGeneralInput.addEventListener('input', cargarRegistros);
      if (filtrarPagoSelect) filtrarPagoSelect.addEventListener('change', cargarRegistros);
    });

    // Formatear Fecha
    function formatearFechaChile(fechaIso) {
      if (!fechaIso) return 'N/A';
      const soloFecha = fechaIso.split('T')[0];
      const partes = soloFecha.split('-');
      if (partes.length !== 3) return 'N/A';
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    // Auth
    async function verificarSesion() {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        bsLoginModal.hide();
        cargarRegistros();
      } else {
        bsLoginModal.show();
      }
    }

    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) {
          alert('Credenciales inválidas: ' + error.message);
        } else {
          bsLoginModal.hide();
          cargarRegistros();
        }
      });
    }

    if (btnCerrarSesion) {
      btnCerrarSesion.addEventListener('click', async () => {
        await client.auth.signOut();
        window.location.reload();
      });
    }

    // Cargar Registros
    async function cargarRegistros() {
      let query = client.from('ordenes').select('*').order('id', { ascending: false });

      const busqueda = buscarGeneralInput ? buscarGeneralInput.value.trim() : '';
      if (busqueda) {
        query = query.or(`patente.ilike.%${busqueda}%,nombre_empresa.ilike.%${busqueda}%,detalle.ilike.%${busqueda}%`);
      }

      const pagoFiltro = filtrarPagoSelect ? filtrarPagoSelect.value : 'Todos';
      if (pagoFiltro !== 'Todos') {
        query = query.eq('medio_pago', pagoFiltro);
      }

      const { data: ordenes, error } = await query;
      if (error) return console.error('Error al cargar:', error);

      listaOrdenes = ordenes || [];
      if (!tablaBody) return;
      tablaBody.innerHTML = '';

      if (!ordenes || ordenes.length === 0) {
        tablaBody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted small">No se encontraron órdenes registradas.</td></tr>`;
        return;
      }

      ordenes.forEach(o => {
        const tr = document.createElement('tr');
        tr.id = `fila-${o.id}`;

        if (idEditandoActualmente === o.id) {
          renderFilaEditable(tr, o);
        } else {
          renderFilaNormal(tr, o);
        }

        if (idNuevoValeReciente === o.id) {
          tr.classList.add('row-highlight-new');
        }
        
        tablaBody.appendChild(tr);
      });
    }

    // Render Normal
    function renderFilaNormal(tr, o) {
      const fechaFormateada = formatearFechaChile(o.created_at);
      const esReciente = idNuevoValeReciente === o.id;

      let badgePagoClass = 'badge-soft-success';
      if (o.medio_pago === 'Tarjeta') badgePagoClass = 'badge-soft-primary';
      if (o.medio_pago === 'Transferencia') badgePagoClass = 'badge-soft-purple';

      tr.innerHTML = `
        <td class="ps-3 fw-bold text-dark">
          #${o.id}
          ${esReciente ? '<span class="badge bg-success ms-1 fs-9 text-uppercase">Nuevo</span>' : ''}
        </td>
        <td class="text-secondary small">${fechaFormateada}</td>
        <td>
          <div class="fw-semibold text-dark">${o.nombre_empresa || 'S/N'}</div>
          <div class="text-muted fs-8">${o.marca || ''} • <span class="badge bg-light text-dark border font-mono">${o.patente || 'S/P'}</span></div>
        </td>
        <td class="text-secondary small text-wrap" style="max-width: 250px;">
          ${o.detalle || '<span class="text-muted italic">Sin detalle</span>'}
        </td>
        <td class="fw-semibold text-dark">$${(o.valor_neto || 0).toLocaleString('es-CL')}</td>
        <td class="fw-bold text-dark">$${(o.valor_total || 0).toLocaleString('es-CL')}</td>
        <td>
          <span class="badge ${badgePagoClass} px-2 py-1 font-medium">${o.medio_pago || 'Efectivo'}</span>
        </td>
        <td class="text-end pe-3">
          <button onclick="activarEdicionFila(${o.id})" class="btn btn-light btn-action text-secondary border me-1" title="Editar">
            <i class="bi bi-pencil"></i>
          </button>
          <button onclick="eliminarRegistro(${o.id})" class="btn btn-light btn-action text-danger border" title="Eliminar">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      `;
    }

    // Render Editable en línea
    function renderFilaEditable(tr, o) {
      tr.className = "table-warning align-middle";
      const fechaFormateada = formatearFechaChile(o.created_at);
      
      tr.innerHTML = `
        <td class="ps-3 fw-bold">#${o.id}</td>
        <td class="small text-muted">${fechaFormateada}</td>
        <td>
          <input type="text" id="editEmpresa-${o.id}" value="${o.nombre_empresa || ''}" placeholder="Empresa" class="form-control form-control-sm mb-1">
          <div class="d-flex gap-1">
            <input type="text" id="editPatente-${o.id}" value="${o.patente || ''}" placeholder="Patente" class="form-control form-control-sm text-uppercase fw-bold">
            <input type="text" id="editMarca-${o.id}" value="${o.marca || ''}" placeholder="Marca" class="form-control form-control-sm">
          </div>
        </td>
        <td>
          <textarea id="editDetalle-${o.id}" rows="2" class="form-control form-control-sm">${o.detalle || ''}</textarea>
        </td>
        <td>
          <input type="number" id="editNeto-${o.id}" value="${o.valor_neto || 0}" oninput="calcularIvaEnLinea(${o.id})" class="form-control form-control-sm fw-bold">
        </td>
        <td>
          <input type="number" id="editTotal-${o.id}" value="${o.valor_total || 0}" class="form-control form-control-sm fw-bold text-success">
        </td>
        <td>
          <select id="editMedioPago-${o.id}" class="form-select form-select-sm">
            <option value="Efectivo" ${o.medio_pago === 'Efectivo' ? 'selected' : ''}>Efectivo</option>
            <option value="Tarjeta" ${o.medio_pago === 'Tarjeta' ? 'selected' : ''}>Tarjeta</option>
            <option value="Transferencia" ${o.medio_pago === 'Transferencia' ? 'selected' : ''}>Transferencia</option>
          </select>
        </td>
        <td class="text-end pe-3">
          <div class="d-flex gap-1 justify-content-end">
            <button onclick="guardarEdicionFila(${o.id})" class="btn btn-sm btn-success" title="Guardar">
              <i class="bi bi-check-lg"></i>
            </button>
            <button onclick="cancelarEdicionFila()" class="btn btn-sm btn-secondary" title="Cancelar">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </td>
      `;
    }

    // Acciones Edición
    function activarEdicionFila(id) {
      idEditandoActualmente = id;
      cargarRegistros();
    }

    function cancelarEdicionFila() {
      idEditandoActualmente = null;
      cargarRegistros();
    }

    function calcularIvaEnLinea(id) {
      const neto = parseFloat(document.getElementById(`editNeto-${id}`).value) || 0;
      document.getElementById(`editTotal-${id}`).value = Math.round(neto * 1.19);
    }

    async function guardarEdicionFila(id) {
      const datosActualizados = {
        nombre_empresa: document.getElementById(`editEmpresa-${id}`).value.trim(),
        patente: document.getElementById(`editPatente-${id}`).value.trim().toUpperCase(),
        marca: document.getElementById(`editMarca-${id}`).value.trim(),
        detalle: document.getElementById(`editDetalle-${id}`).value.trim(),
        valor_neto: parseFloat(document.getElementById(`editNeto-${id}`).value) || 0,
        valor_total: parseFloat(document.getElementById(`editTotal-${id}`).value) || 0,
        medio_pago: document.getElementById(`editMedioPago-${id}`).value
      };

      const { error } = await client.from('ordenes').update(datosActualizados).eq('id', id);

      if (error) {
        alert('Error al actualizar: ' + error.message);
      } else {
        idEditandoActualmente = null;
        cargarRegistros();
      }
    }

    async function eliminarRegistro(id) {
      if (!confirm(`¿Eliminar la orden #${id}?`)) return;

      const { error } = await client.from('ordenes').delete().eq('id', id);
      if (error) {
        alert('Error al eliminar: ' + error.message);
      } else {
        cargarRegistros();
      }
    }

    // Exportar Excel / CSV
    async function exportarExcel() {
      const { data: ordenes, error } = await client.from('ordenes').select('*').order('id', { ascending: false });
      if (error) return alert('Error al obtener datos.');

      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += "Folio;Fecha;Empresa;Marca;Patente;Detalle;Neto;Total;Medio Pago\n";

      ordenes.forEach(o => {
        const fecha = formatearFechaChile(o.created_at);
        csvContent += `${o.id};${fecha};"${o.nombre_empresa}";"${o.marca}";"${o.patente}";"${o.detalle || ''}";${o.valor_neto || 0};${o.valor_total || 0};"${o.medio_pago}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Ordenes_Trabajo_${new Date().toLocaleDateString('es-CL')}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Realtime Notifications
    function mostrarToastNuevoVale(vale) {
      document.getElementById('toastTitle').textContent = `¡Nuevo Vale #${vale.id}!`;
      document.getElementById('toastBody').textContent = `Vehículo: ${vale.patente || 'S/N'} (${vale.nombre_empresa || 'Empresa'})`;
      bsToast.show();
    }

    client
      .channel('cambios-vales-admin-bs')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ordenes' }, (payload) => {
        if (payload.eventType === 'INSERT') {
          idNuevoValeReciente = payload.new.id;
          mostrarToastNuevoVale(payload.new);
        }
        cargarRegistros();
      })
      .subscribe();
  </script>
</body>
</html>
