<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de Servicios | Taller Mecánico</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

  <!-- Contenedor Principal -->
  <div class="max-w-3xl mx-auto w-full bg-slate-800 border border-slate-700/60 rounded-2xl shadow-2xl p-6 md:p-10 my-auto">
    
    <!-- Encabezado del Formulario -->
    <div class="flex items-center space-x-4 border-b border-slate-700/60 pb-6 mb-8">
      <div class="p-3 bg-blue-600/10 text-blue-500 rounded-xl border border-blue-500/20">
        <i data-lucide="wrench" class="w-8 h-8"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Nuevo Vale de Servicio</h1>
        <p class="text-sm text-slate-400">Ingresa los datos del vehículo y el trabajo a realizar</p>
      </div>
    </div>

    <!-- Formulario -->
    <form id="formularioServicio" class="space-y-6">

      <!-- Sección 1: Selección de Empresa -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">
          Empresa / Unidad
        </label>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <label class="flex items-center p-3.5 bg-slate-900/60 border border-slate-700 rounded-xl cursor-pointer hover:border-blue-500/50 transition-all">
            <input type="radio" name="empresa_option" value="Empresa A" class="w-4 h-4 text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
            <span class="ml-3 text-sm font-medium text-slate-200">Empresa A</span>
          </label>
          <label class="flex items-center p-3.5 bg-slate-900/60 border border-slate-700 rounded-xl cursor-pointer hover:border-blue-500/50 transition-all">
            <input type="radio" name="empresa_option" value="Empresa B" class="w-4 h-4 text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
            <span class="ml-3 text-sm font-medium text-slate-200">Empresa B</span>
          </label>
        </div>
      </div>

      <!-- Sección 2: Datos del Vehículo -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="marca" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Marca / Modelo</label>
          <div class="relative">
            <i data-lucide="car" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input type="text" id="marca" required placeholder="Ej: Audi A3" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
          </div>
        </div>

        <div>
          <label for="patente" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Patente</label>
          <div class="relative">
            <i data-lucide="credit-card" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input type="text" id="patente" required placeholder="BBCL10" class="w-full uppercase font-mono tracking-wider bg-slate-900/80 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
          </div>
        </div>
      </div>

      <!-- Sección 3: Detalle del Servicio -->
      <div>
        <label for="detalle" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Detalle de Reparación / Trabajo</label>
        <textarea id="detalle" rows="3" required placeholder="Descripción de los servicios realizandose (ej: Alineación, cuadratura, cambio de piezas)..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm resize-none"></textarea>
      </div>

      <!-- Sección 4: Valores Monetarios -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="valor_neto" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Valor Neto ($)</label>
          <input type="number" id="valor_neto" placeholder="0" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
        </div>

        <div>
          <label for="valor_total" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Valor Total ($)</label>
          <input type="number" id="valor_total" placeholder="0" class="w-full bg-slate-900/80 border border-slate-700 font-semibold text-blue-400 rounded-xl px-4 py-2.5 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
        </div>
      </div>

      <!-- Sección 5: Medio de Pago -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Medio de Pago</label>
        <div class="flex flex-wrap gap-4">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="radio" name="medio_pago" value="Efectivo" checked class="text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
            <span class="text-sm text-slate-300">Efectivo</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="radio" name="medio_pago" value="Transferencia" class="text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
            <span class="text-sm text-slate-300">Transferencia</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="radio" name="medio_pago" value="Tarjeta" class="text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
            <span class="text-sm text-slate-300">Tarjeta</span>
          </label>
        </div>
      </div>

      <!-- Botón de Envío -->
      <div class="pt-4">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-600/25 transition-all flex items-center justify-center space-x-2">
          <i data-lucide="check-circle" class="w-5 h-5"></i>
          <span>Generar Vale de Servicio</span>
        </button>
      </div>

    </form>
  </div>

  <!-- Inicializar Lucide Icons -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
