<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de Vales de Servicio</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
    }
    .form-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      max-width: 620px;
      margin: 0 auto;
    }
    .radio-box-group {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1rem;
    }
    .form-label-custom {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #475569;
    }
    .btn-primary-custom {
      background-color: #5352ed;
      border-color: #5352ed;
      color: #ffffff;
      font-weight: 700;
      padding: 0.75rem;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .btn-primary-custom:hover {
      background-color: #3b3acb;
      border-color: #3b3acb;
      transform: translateY(-1px);
    }
    .btn-nav {
      font-size: 0.8125rem;
      font-weight: 600;
      border-radius: 20px;
      padding: 0.4rem 1rem;
    }
    .payment-option-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.6rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #ffffff;
    }
    .payment-option-card:hover {
      border-color: #cbd5e1;
      background-color: #f8fafc;
    }
    .form-check-input:checked + .form-check-label {
      font-weight: 700;
      color: #5352ed;
    }
  </style>
</head>
<body class="py-4">

  <div class="container">
    
    <!-- BOTONES SUPERIORES DE NAVEGACIÓN -->
    <div class="d-flex justify-content-center align-items-center gap-2 mb-4">
      <button id="btnCerrarSesion" class="btn btn-danger-subtle text-danger border border-danger-subtle btn-nav d-flex align-items-center gap-1.5">
        <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
      </button>
      <a href="admin.html" class="btn btn-light text-secondary border btn-nav d-flex align-items-center gap-1.5">
        <i class="bi bi-gear-fill"></i> Administración de Vales
      </a>
    </div>

    <!-- TARJETA DEL FORMULARIO -->
    <div class="card form-card p-4 p-sm-5">
      
      <!-- ENCABEZADO -->
      <div class="text-center mb-4">
        <h2 class="fw-extrabold text-dark tracking-tight mb-1" style="font-weight: 800; font-size: 1.5rem;">
          VALES ELECTRÓNICOS DE SERVICIO
        </h2>
        <p class="text-muted fs-7 mb-0">Completa los datos para registrar el Vale</p>
      </div>

      <form id="formVale" class="needs-validation" novalidate>
        
        <!-- NOMBRE DE EMPRESA -->
        <div class="mb-4">
          <label class="form-label form-label-custom mb-1">Nombre de Empresa</label>
          <div class="text-muted fs-8 mb-2">Selecciona 1 opción</div>
          
          <div class="radio-box-group">
            <div class="row g-2">
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="empresa" id="empParticular" value="Particular" checked>
                  <label class="form-check-label text-dark fs-7" for="empParticular">Particular</label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="empresa" id="empSenefa" value="Senefa">
                  <label class="form-check-label text-dark fs-7" for="empSenefa">Senefa</label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="empresa" id="empOD" value="OD Automotriz">
                  <label class="form-check-label text-dark fs-7" for="empOD">OD Automotriz</label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="empresa" id="empBaudet" value="Baudet">
                  <label class="form-check-label text-dark fs-7" for="empBaudet">Baudet</label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="empresa" id="empIncubo" value="Incubo">
                  <label class="form-check-label text-dark fs-7" for="empIncubo">Incubo</label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="empresa" id="empOporto" value="Oporto Garces">
                  <label class="form-check-label text-dark fs-7" for="empOporto">Oporto Garces</label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="empresa" id="empSuarez" value="Suarez">
                  <label class="form-check-label text-dark fs-7" for="empSuarez">Suarez</label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="empresa" id="empVimont" value="Vimont">
                  <label class="form-check-label text-dark fs-7" for="empVimont">Vimont</label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- MARCA Y PATENTE -->
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label for="inputMarca" class="form-label form-label-custom">Marca</label>
            <input type="text" class="form-control form-control-lg fs-7" id="inputMarca" placeholder="EJ: AUDI" required>
          </div>
          <div class="col-6">
            <label for="inputPatente" class="form-label form-label-custom">Patente</label>
            <input type="text" class="form-control form-control-lg fs-7 text-uppercase fw-bold" id="inputPatente" placeholder="ABCD12" required maxlength="10">
          </div>
        </div>

        <!-- DETALLE DEL SERVICIO -->
        <div class="mb-3">
          <label for="inputDetalle" class="form-label form-label-custom">Detalle del Servicio</label>
          <textarea class="form-control fs-7" id="inputDetalle" rows="3" placeholder="Descripción del trabajo..." required></textarea>
        </div>

        <!-- VALOR NETO Y TOTAL -->
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label for="inputNeto" class="form-label form-label-custom">Valor Neto ($)</label>
            <input type="number" class="form-control form-control-lg fs-7 fw-semibold" id="inputNeto" placeholder="Ej: 10000" required>
          </div>
          <div class="col-6">
            <label for="inputTotal" class="form-label form-label-custom">Valor Total ($)</label>
            <input type="number" class="form-control form-control-lg fs-7 fw-bold text-success" id="inputTotal" placeholder="Ej: 11900" required>
          </div>
        </div>

        <!-- MEDIO DE PAGO -->
        <div class="mb-4">
          <label class="form-label form-label-custom mb-2">Medio de Pago</label>
          <div class="row g-2">
            <div class="col-4">
              <label class="payment-option-card w-100" for="pagoEfectivo">
                <div class="form-check d-flex justify-content-center align-items-center gap-1 p-0 m-0">
                  <input class="form-check-input m-0" type="radio" name="medioPago" id="pagoEfectivo" value="Efectivo" checked>
                  <span class="form-check-label fs-7 ms-1">Efectivo</span>
                </div>
              </label>
            </div>
            <div class="col-4">
              <label class="payment-option-card w-100" for="pagoTarjeta">
                <div class="form-check d-flex justify-content-center align-items-center gap-1 p-0 m-0">
                  <input class="form-check-input m-0" type="radio" name="medioPago" id="pagoTarjeta" value="Tarjeta">
                  <span class="form-check-label fs-7 ms-1">Tarjeta</span>
                </div>
              </label>
            </div>
            <div class="col-4">
              <label class="payment-option-card w-100" for="pagoEmpresa">
                <div class="form-check d-flex justify-content-center align-items-center gap-1 p-0 m-0">
                  <input class="form-check-input m-0" type="radio" name="medioPago" id="pagoEmpresa" value="Transferencia">
                  <span class="form-check-label fs-7 ms-1">Empresa</span>
                </div>
              </label>
            </div>
          </div>
        </div>

        <!-- BOTÓN GUARDAR -->
        <button type="submit" id="btnGuardar" class="btn btn-primary-custom w-100 shadow-sm mb-3">
          Guardar Vale de Servicio
        </button>

        <!-- PIE DE FORMULARIO -->
        <div class="text-center text-muted fs-8">
          Alineaciones Bustamante © 2026
        </div>

      </form>
    </div>
  </div>

  <!-- LÓGICA SUPABASE Y FUNCIONALIDAD -->
  <script>
    const SUPABASE_URL = "https://okkydrwdexacxvfbtopb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XY2XRiAQw4tQdygSAwd4XA_pRETQ_EA";

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const inputNeto = document.getElementById('inputNeto');
    const inputTotal = document.getElementById('inputTotal');
    const formVale = document.getElementById('formVale');
    const btnGuardar = document.getElementById('btnGuardar');

    // Calcular IVA en automático al escribir el valor neto
    inputNeto.addEventListener('input', () => {
      const neto = parseFloat(inputNeto.value) || 0;
      inputTotal.value = Math.round(neto * 1.19);
    });

    // Guardar Vale en Supabase
    formVale.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnGuardar.disabled = true;
      btnGuardar.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Guardando...`;

      const empresaSeleccionada = document.querySelector('input[name="empresa"]:checked')?.value || 'Particular';
      const marca = document.getElementById('inputMarca').value.trim();
      const patente = document.getElementById('inputPatente').value.trim().toUpperCase();
      const detalle = document.getElementById('inputDetalle').value.trim();
      const valorNeto = parseFloat(inputNeto.value) || 0;
      const valorTotal = parseFloat(inputTotal.value) || 0;
      const medioPago = document.querySelector('input[name="medioPago"]:checked')?.value || 'Efectivo';

      const { data, error } = await client
        .from('ordenes')
        .insert([
          {
            nombre_empresa: empresaSeleccionada,
            marca: marca,
            patente: patente,
            detalle: detalle,
            valor_neto: valorNeto,
            valor_total: valorTotal,
            medio_pago: medioPago
          }
        ]);

      btnGuardar.disabled = false;
      btnGuardar.innerHTML = 'Guardar Vale de Servicio';

      if (error) {
        alert('Ocurrió un error al registrar el vale: ' + error.message);
      } else {
        alert('¡Vale registrado exitosamente!');
        formVale.reset();
        document.getElementById('empParticular').checked = true;
        document.getElementById('pagoEfectivo').checked = true;
      }
    });

    // Botón Salir
    document.getElementById('btnCerrarSesion').addEventListener('click', async () => {
      await client.auth.signOut();
      alert('Sesión cerrada correctamente.');
    });
  </script>
</body>
</html>
