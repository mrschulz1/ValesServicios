<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de Vales de Servicio | Alineaciones Bustamante</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between p-4 md:p-6">

  <!-- Barra Superior de Navegación -->
  <div class="max-w-xl mx-auto w-full flex justify-between items-center mb-6">
    <button id="btnLogout" class="flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold text-rose-600 bg-rose-50 border border-rose-200 rounded-lg hover:bg-rose-100 transition-all">
      <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
      <span>Cerrar Sesión</span>
    </button>

    <a href="admin.html" class="flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-all shadow-sm">
      <i data-lucide="settings" class="w-3.5 h-3.5"></i>
      <span>Administración de Vales</span>
    </a>
  </div>

  <!-- Contenedor Principal del Formulario -->
  <div class="max-w-xl mx-auto w-full bg-white border border-slate-200/80 rounded-2xl shadow-xl p-6 md:p-8 my-auto">
    
    <!-- Encabezado con Logo -->
    <div class="text-center mb-6 border-b border-slate-100 pb-5">
      <img src="logo.png" alt="Alineaciones Bustamante" class="h-14 mx-auto mb-2 object-contain" onerror="this.style.display='none'">
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">VALES ELECTRÓNICOS DE SERVICIO</h1>
      <p class="text-xs font-medium text-slate-400 mt-0.5">Completa los datos para registrar el Vale</p>
    </div>

    <!-- Formulario -->
    <form id="formVale" class="space-y-5">

      <!-- Sección 1: Selección de Empresa -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
          Nombre de Empresa <span class="text-slate-400 font-normal">(Selecciona 1 opción)</span>
        </label>
        <div class="grid grid-cols-2 gap-2 p-3 bg-slate-50 border border-slate-200/80 rounded-xl">
          <label class="flex items-center p-2 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-blue-500 transition-all">
            <input type="radio" name="empresa_option" value="Particular" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">Particular</span>
          </label>

          <label class="flex items-center p-2 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-blue-500 transition-all">
            <input type="radio" name="empresa_option" value="Senefa" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">Senefa</span>
          </label>

          <label class="flex items-center p-2 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-blue-500 transition-all">
            <input type="radio" name="empresa_option" value="OD Automotriz" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">OD Automotriz</span>
          </label>

          <label class="flex items-center p-2 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-blue-500 transition-all">
            <input type="radio" name="empresa_option" value="Baudet" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">Baudet</span>
          </label>

          <label class="flex items-center p-2 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-blue-500 transition-all">
            <input type="radio" name="empresa_option" value="Incubo" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">Incubo</span>
          </label>

          <label class="flex items-center p-2 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-blue-500 transition-all">
            <input type="radio" name="empresa_option" value="Oporto Garces" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">Oporto Garces</span>
          </label>

          <label class="flex items-center p-2 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-blue-500 transition-all">
            <input type="radio" name="empresa_option" value="Suarez" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">Suarez</span>
          </label>

          <label class="flex items-center p-2 bg-white border border-slate-200 rounded-lg cursor-pointer hover:border-blue-500 transition-all">
            <input type="radio" name="empresa_option" value="Vimont" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">Vimont</span>
          </label>
        </div>
      </div>

      <!-- Sección 2: Marca y Patente -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="marca" class="block text-xs font-bold text-slate-500 uppercase mb-1">Marca</label>
          <div class="relative">
            <i data-lucide="car" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="marca" required placeholder="EJ: AUDI" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all uppercase">
          </div>
        </div>

        <div>
          <label for="patente" class="block text-xs font-bold text-slate-500 uppercase mb-1">Patente</label>
          <div class="relative">
            <i data-lucide="credit-card" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="patente" required placeholder="ABCD12" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 font-mono tracking-wider focus:bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all uppercase">
          </div>
        </div>
      </div>

      <!-- Sección 3: Detalle del Servicio -->
      <div>
        <label for="detalle" class="block text-xs font-bold text-slate-500 uppercase mb-1">Detalle del Servicio</label>
        <textarea id="detalle" rows="3" required placeholder="Descripción del trabajo realizado..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all resize-none"></textarea>
      </div>

      <!-- Sección 4: Valores Monetarios -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="valor_neto" class="block text-xs font-bold text-slate-500 uppercase mb-1">Valor Neto ($)</label>
          <div class="relative">
            <i data-lucide="dollar-sign" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="number" id="valor_neto" placeholder="Ej: 10000" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all">
          </div>
        </div>

        <div>
          <label for="valor_total" class="block text-xs font-bold text-slate-500 uppercase mb-1">Valor Total ($)</label>
          <div class="relative">
            <i data-lucide="calculator" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="number" id="valor_total" placeholder="Ej: 11900" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold text-blue-600 focus:bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all">
          </div>
        </div>
      </div>

      <!-- Sección 5: Medio de Pago -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Medio de Pago</label>
        <div class="grid grid-cols-3 gap-2">
          <label class="flex items-center justify-center p-2.5 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-white hover:border-blue-500 transition-all text-center">
            <input type="radio" name="medio_pago" value="Efectivo" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">Efectivo</span>
          </label>

          <label class="flex items-center justify-center p-2.5 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-white hover:border-blue-500 transition-all text-center">
            <input type="radio" name="medio_pago" value="Tarjeta" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">Tarjeta</span>
          </label>

          <label class="flex items-center justify-center p-2.5 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-white hover:border-blue-500 transition-all text-center">
            <input type="radio" name="medio_pago" value="Empresa" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-slate-700">Empresa</span>
          </label>
        </div>
      </div>

      <!-- Botón de Envío -->
      <div class="pt-2">
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:from-blue-800 active:to-indigo-800 text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center space-x-2">
          <i data-lucide="save" class="w-5 h-5"></i>
          <span>Guardar Vale de Servicio</span>
        </button>
      </div>

    </form>

    <!-- Pie de página corporativo -->
    <p class="text-center text-xs text-slate-400 mt-6">Alineaciones Bustamante © 2026</p>
  </div>

  <!-- Lucide Icons y Lógica JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Inicializar Iconos
    lucide.createIcons();

    // -------------------------------------------------------------
    // CONEXIÓN CON SUPABASE Y LÓGICA DE ENVÍO
    // (Asegúrate de tener tus variables de cliente configuradas)
    // -------------------------------------------------------------
    const form = document.getElementById('formVale');
    const inputNeto = document.getElementById('valor_neto');
    const inputTotal = document.getElementById('valor_total');

    // Cálculo automático de Total según el Neto (opcional)
    inputNeto?.addEventListener('input', () => {
      const neto = parseFloat(inputNeto.value) || 0;
      if (neto > 0) {
        inputTotal.value = Math.round(neto * 1.19);
      } else {
        inputTotal.value = '';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // 1. Validar selección de Empresa
      const empresaRadio = document.querySelector('input[name="empresa_option"]:checked');
      if (!empresaRadio) {
        alert('Por favor selecciona una empresa.');
        return;
      }

      // 2. Definir Folio Siguiente (tu lógica actual)
      let siguienteFolio = 1;
      if (typeof ultimasOrdenes !== 'undefined' && ultimasOrdenes && ultimasOrdenes.length > 0) {
        const ultimoId = ultimasOrdenes[0].id;
        if (ultimoId >= 12900) {
          siguienteFolio = ultimoId + 1;
        }
      }

      // 3. Estructurar Objeto
      const datos = {
        id: siguienteFolio,
        nombre_empresa: empresaRadio.value,
        marca: document.getElementById('marca').value,
        patente: document.getElementById('patente').value.toUpperCase().trim(),
        detalle: document.getElementById('detalle').value,
        valor_neto: parseFloat(inputNeto.value) || 0,
        valor_total: parseFloat(inputTotal.value) || 0,  
        medio_pago: document.querySelector('input[name="medio_pago"]:checked').value
      };

      // 4. Inserción en Supabase (Sustituir 'client' por tu instancia de Supabase)
      if (typeof client !== 'undefined') {
        const { data, error } = await client
          .from('ordenes')
          .insert([datos])
          .select();

        if (error) {
          alert('Error al guardar: ' + error.message);
        } else {
          alert(`¡Vale Guardado! Folio Vale: #${data[0].id}`);
          form.reset();
        }
      } else {
        console.log('Datos preparados para guardar:', datos);
      }
    });
  </script>
</body>
</html>
