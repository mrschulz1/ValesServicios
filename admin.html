<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Alineaciones Bustamante</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between p-4 md:p-6">

  <!-- Contenedor Principal -->
  <div class="max-w-6xl mx-auto w-full space-y-6">

    <!-- Encabezado y Navegación -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white border border-slate-200/80 rounded-2xl p-6 shadow-sm">
      <div class="flex items-center space-x-4">
        <img src="logo.png" alt="Alineaciones Bustamante" class="h-12 object-contain" onerror="this.style.display='none'">
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">Panel de Control de Vales</h1>
          <p class="text-xs text-slate-400 mt-0.5">Historial y gestión de registros de servicio</p>
        </div>
      </div>

      <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
        <a href="index.html" class="flex items-center space-x-1.5 px-3.5 py-2 text-xs font-semibold text-slate-700 bg-slate-100 border border-slate-200 rounded-xl hover:bg-slate-200 transition-all">
          <i data-lucide="plus-circle" class="w-4 h-4 text-blue-600"></i>
          <span>Nuevo Vale</span>
        </a>

        <button id="btnLogout" class="flex items-center space-x-1.5 px-3.5 py-2 text-xs font-semibold text-rose-600 bg-rose-50 border border-rose-200 rounded-xl hover:bg-rose-100 transition-all">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Salir</span>
        </button>
      </div>
    </div>

    <!-- Barra de Filtros y Métricas Rápidas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Buscador -->
      <div class="md:col-span-2 bg-white border border-slate-200/80 rounded-2xl p-4 shadow-sm flex items-center space-x-3">
        <div class="relative w-full">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="inputBuscar" placeholder="Buscar por Patente, Empresa, Marca o Folio..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all">
        </div>
        <button id="btnRefrescar" class="p-2.5 bg-slate-100 border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-200 transition-all" title="Actualizar datos">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Resumen Total -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-4 shadow-sm text-white flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-blue-100">Total Recaudado</p>
          <h2 id="totalAcumulado" class="text-2xl font-bold tracking-tight mt-0.5">$0</h2>
        </div>
        <div class="p-3 bg-white/10 rounded-xl border border-white/20">
          <i data-lucide="dollar-sign" class="w-6 h-6 text-white"></i>
        </div>
      </div>

    </div>

    <!-- Tabla de Vales -->
    <div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200/80 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
              <th class="py-3.5 px-4">Folio</th>
              <th class="py-3.5 px-4">Empresa</th>
              <th class="py-3.5 px-4">Vehículo</th>
              <th class="py-3.5 px-4">Patente</th>
              <th class="py-3.5 px-4">Detalle</th>
              <th class="py-3.5 px-4">Medio Pago</th>
              <th class="py-3.5 px-4 text-right">Neto</th>
              <th class="py-3.5 px-4 text-right">Total</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpo" class="divide-y divide-slate-100 text-sm text-slate-700">
            <tr>
              <td colspan="8" class="text-center py-8 text-slate-400">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>
                <span>Cargando Vales de Servicio...</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pie de página corporativo -->
    <p class="text-center text-xs text-slate-400">Alineaciones Bustamante © 2026</p>

  </div>

  <!-- Cliente JS Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    lucide.createIcons();

    // =============================================================
    // 1. CONFIGURA AQUÍ TUS CREDENCIALES DE SUPABASE
    // =============================================================
    const SUPABASE_URL = 'https://okkydrwdexacxvfbtopb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_XY2XRiAQw4tQdygSAwd4XA_pRETQ_EA';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =============================================================
    // 2. CONSULTA Y RENDERIZADO DE VALES DESDE LA BASE DE DATOS
    // =============================================================
    let ordenesLocales = [];

    async function cargarOrdenes() {
      const tbody = document.getElementById('tablaCuerpo');

      try {
        const { data, error } = await client
          .from('ordenes')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        ordenesLocales = data || [];
        renderizarTabla(ordenesLocales);

      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-8 text-rose-500 font-medium">
              Error al consultar los registros: ${err.message}
            </td>
          </tr>`;
      }
    }

    function renderizarTabla(lista) {
      const tbody = document.getElementById('tablaCuerpo');
      const totalAcumuladoEl = document.getElementById('totalAcumulado');

      if (!lista || lista.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-8 text-slate-400 font-medium">
              No se encontraron Vales registrados.
            </td>
          </tr>`;
        totalAcumuladoEl.innerText = '$0';
        return;
      }

      let sumaTotal = 0;
      let html = '';

      lista.forEach(item => {
        const total = item.valor_total || 0;
        sumaTotal += total;

        html += `
          <tr class="hover:bg-slate-50/80 transition-colors">
            <td class="py-3 px-4 font-bold text-blue-600">#${item.id}</td>
            <td class="py-3 px-4 font-medium text-slate-900">${item.nombre_empresa || '-'}</td>
            <td class="py-3 px-4">${item.marca || '-'}</td>
            <td class="py-3 px-4"><span class="font-mono bg-slate-100 border border-slate-200 px-2 py-0.5 rounded text-xs font-semibold text-slate-800">${item.patente || '-'}</span></td>
            <td class="py-3 px-4 text-xs text-slate-500 max-w-xs truncate">${item.detalle || '-'}</td>
            <td class="py-3 px-4">
              <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200">
                ${item.medio_pago || 'N/A'}
              </span>
            </td>
            <td class="py-3 px-4 text-right text-slate-500 font-mono text-xs">$${(item.valor_neto || 0).toLocaleString('es-CL')}</td>
            <td class="py-3 px-4 text-right font-bold text-slate-900 font-mono">$${total.toLocaleString('es-CL')}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
      totalAcumuladoEl.innerText = `$${sumaTotal.toLocaleString('es-CL')}`;
      lucide.createIcons();
    }

    // Buscador
    document.getElementById('inputBuscar')?.addEventListener('input', (e) => {
      const termino = e.target.value.toLowerCase().trim();
      const filtrados = ordenesLocales.filter(item => {
        return (
          (item.patente && item.patente.toLowerCase().includes(termino)) ||
          (item.nombre_empresa && item.nombre_empresa.toLowerCase().includes(termino)) ||
          (item.marca && item.marca.toLowerCase().includes(termino)) ||
          (item.id && item.id.toString().includes(termino))
        );
      });
      renderizarTabla(filtrados);
    });

    // Refrescar manualmente
    document.getElementById('btnRefrescar')?.addEventListener('click', cargarOrdenes);

    // Cargar al iniciar
    document.addEventListener('DOMContentLoaded', cargarOrdenes);
  </script>
</body>
</html>
