<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administracion de Vales</title>
  <link rel="icon" type="image/png" href="logooriginal.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between p-4">

  <!-- Modal de Autenticación Genérico -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full border border-slate-200">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-xl">🔑</div>
        <h2 class="text-lg font-bold text-slate-900">Acceso al Sistema</h2>
        <p class="text-xs text-slate-500">Ingresa con tus credenciales del taller</p>
      </div>
      
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase">Token / Email</label>
          <input type="email" id="loginEmail" required class="mt-1 w-full rounded-lg border-slate-300 p-2.5 border text-sm focus:ring-indigo-500" placeholder="usuario@taller.cl">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase">Contraseña</label>
          <input type="password" id="loginPassword" required class="mt-1 w-full rounded-lg border-slate-300 p-2.5 border text-sm focus:ring-indigo-500" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <div class="w-full max-w-7xl mx-auto space-y-6">
    <!-- Encabezado -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Panel de Control de Vales</h1>
        <p class="text-xs text-slate-500">Gestión y edición directa en tabla</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnCerrarSesion" class="text-xs bg-red-100 hover:bg-red-200 text-red-700 px-3 py-2 rounded-lg font-medium transition shadow-sm">
          🚪 Cerrar Sesión
        </button>
        <a href="index.html" class="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition shadow-sm">
          ⬅️ Regresar a Vales
        </a>
      </div>
    </div>

    <!-- Filtros de búsqueda -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3">
      <input type="text" id="buscarGeneral" placeholder="Buscar patente, empresa o detalle..." class="flex-grow rounded-lg border-slate-300 p-2.5 border text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
      
      <select id="filtrarPago" class="rounded-lg border-slate-300 p-2.5 border text-sm text-slate-600 bg-white focus:border-indigo-500">
        <option value="Todos">Todos los pagos</option>
        <option value="Efectivo">Efectivo</option>
        <option value="Tarjeta">Tarjeta</option>
        <option value="Transferencia">Transferencia</option>
      </select>

      <button onclick="exportarExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition shadow-sm inline-flex items-center gap-2">
        📥 Exportar Excel
      </button>
    </div>

    <!-- Tabla de órdenes -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-md font-bold text-slate-900 mb-4">Vales Registrados</h2>
      <div class="relative max-h-[600px] overflow-y-auto overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
        <table class="w-full text-left border-collapse">
          <thead class="sticky top-0 bg-slate-100 z-10 shadow-sm">
            <tr class="text-slate-600 text-xs font-semibold uppercase tracking-wider">
              <th class="px-3 py-3 text-left">Folio</th>
              <th class="px-3 py-3 text-left">Fecha</th>
              <th class="px-3 py-3 text-left">Empresa / Patente / Marca</th>
              <th class="px-3 py-3 text-left">Detalle</th>
              <th class="px-3 py-3 text-left w-28">Neto</th> 
              <th class="px-3 py-3 text-left w-28">Total</th>   
              <th class="px-3 py-3 text-left w-32">Medio Pago</th>
              <th class="px-3 py-3 text-center w-24">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaBody" class="divide-y divide-slate-200 bg-white">
            <!-- Cargado dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="text-center text-xs text-slate-400 py-4">
    Alineaciones Bustamante © 2026
  </div>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script>
    const SUPABASE_URL = "https://okkydrwdexacxvfbtopb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XY2XRiAQw4tQdygSAwd4XA_pRETQ_EA";

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let listaOrdenes = [];
    let idEditandoActualmente = null;
    let idNuevoValeReciente = null; // Guardará el ID del último vale ingresado

    const loginModal = document.getElementById('loginModal');
    const loginForm = document.getElementById('loginForm');
    const btnCerrarSesion = document.getElementById('btnCerrarSesion');
    const tablaBody = document.getElementById('tablaBody');
    const buscarGeneralInput = document.getElementById('buscarGeneral');
    const filtrarPagoSelect = document.getElementById('filtrarPago');

    // --- 1. AUTENTICACIÓN ---
    async function verificarSesion() {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        loginModal.classList.add('hidden');
        cargarRegistros();
      } else {
        loginModal.classList.remove('hidden');
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Credenciales incorrectas: ' + error.message);
      } else {
        loginModal.classList.add('hidden');
        cargarRegistros();
      }
    });

    btnCerrarSesion.addEventListener('click', async () => {
      await client.auth.signOut();
      window.location.reload();
    });

    document.addEventListener('DOMContentLoaded', () => {
      verificarSesion();
      buscarGeneralInput.addEventListener('input', cargarRegistros);
      filtrarPagoSelect.addEventListener('change', cargarRegistros);
    });

    // --- 2. CARGAR Y RENDERIZAR TABLA ---
    async function cargarRegistros() {
      let query = client.from('ordenes').select('*').order('id', { ascending: false });

      const busqueda = buscarGeneralInput.value.trim();
      if (busqueda) {
        query = query.or(`patente.ilike.%${busqueda}%,nombre_empresa.ilike.%${busqueda}%,detalle.ilike.%${busqueda}%`);
      }

      const pagoFiltro = filtrarPagoSelect.value;
      if (pagoFiltro !== 'Todos') {
        query = query.eq('medio_pago', pagoFiltro);
      }

      const { data: ordenes, error } = await query;
      if (error) return console.error('Error al cargar datos:', error);

      listaOrdenes = ordenes || [];
      tablaBody.innerHTML = '';

      if (!ordenes || ordenes.length === 0) {
        tablaBody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-sm text-slate-400">No se encontraron órdenes registradas.</td></tr>`;
        return;
      }

      ordenes.forEach(o => {
        const tr = document.createElement('tr');
        tr.id = `fila-${o.id}`;

        if (idEditandoActualmente === o.id) {
          renderFilaEditable(tr, o);
        } else {
          renderFilaNormal(tr, o);
        }

        // Si es el vale recién ingresado, aplicar la animación/resaltado en verde
        if (idNuevoValeReciente === o.id) {
          tr.classList.add('bg-emerald-100', 'transition-colors', 'duration-1000');
          setTimeout(() => {
            tr.classList.remove('bg-emerald-100');
          }, 4000);
        }
        
        tablaBody.appendChild(tr);
      });
    }

    // MODO LECTURA NORMAL DE LA FILA
    function renderFilaNormal(tr, o) {
      const fechaFormateada = o.created_at ? new Date(o.created_at.split('T')[0] + 'T00:00:00').toLocaleDateString('es-CL') : 'N/A';
      const esReciente = idNuevoValeReciente === o.id;

      tr.className = `hover:bg-slate-50 transition border-b border-slate-100 ${esReciente ? 'bg-emerald-50 font-medium' : ''}`;
      
      tr.innerHTML = `
        <td class="px-3 py-3 text-sm font-semibold text-slate-900">
          #${o.id}
          ${esReciente ? '<span class="ml-1 px-1.5 py-0.5 text-[10px] bg-emerald-600 text-white rounded-full uppercase font-bold animate-pulse">Nuevo</span>' : ''}
        </td>
        <td class="px-3 py-3 text-sm text-slate-500">${fechaFormateada}</td>
        <td class="px-3 py-3 text-sm">
          <div class="font-medium text-slate-900">${o.nombre_empresa || 'S/N'}</div>
          <div class="text-xs text-slate-500">${o.marca || ''} - <span class="font-semibold text-indigo-600">${o.patente || ''}</span></div>
        </td>
        <td class="px-3 py-3 text-sm text-slate-600 max-w-xs break-words whitespace-normal">
          ${o.detalle || '<span class="text-slate-400 italic">Sin detalle</span>'}
        </td>
        <td class="px-3 py-3 text-sm font-bold text-slate-900">$${(o.valor_neto || 0).toLocaleString('es-CL')}</td>
        <td class="px-3 py-3 text-sm font-bold text-slate-900">$${(o.valor_total || 0).toLocaleString('es-CL')}</td>
        <td class="px-3 py-3 text-sm">
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${
            o.medio_pago === 'Efectivo' ? 'bg-green-100 text-green-800' :
            o.medio_pago === 'Tarjeta' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'
          }">${o.medio_pago || 'Efectivo'}</span>
        </td>
        <td class="px-3 py-3 text-sm text-center">
          <div class="flex items-center justify-center gap-1">
            <button onclick="activarEdicionFila(${o.id})" class="text-slate-600 hover:text-indigo-600 p-1.5 rounded-lg hover:bg-slate-200 transition font-bold text-lg leading-none" title="Editar vale">
              ⋮
            </button>
            <button onclick="eliminarRegistro(${o.id})" class="text-red-500 hover:text-red-700 p-1.5 rounded-lg hover:bg-red-50 transition" title="Eliminar vale">
              🗑️
            </button>
          </div>
        </td>
      `;
    }

    // MODO EDICIÓN DIRECTO EN LA TABLA
    function renderFilaEditable(tr, o) {
      tr.className = "bg-amber-50/60 border-b border-amber-200";
      const fechaFormateada = o.created_at ? new Date(o.created_at.split('T')[0] + 'T00:00:00').toLocaleDateString('es-CL') : 'N/A';  
      
      tr.innerHTML = `
        <td class="px-2 py-2 text-xs font-bold text-slate-900">#${o.id}</td>
        <td class="px-2 py-2 text-xs text-slate-500">${fechaFormateada}</td>
        <td class="px-2 py-2 space-y-1">
          <input type="text" id="editEmpresa-${o.id}" value="${o.nombre_empresa || ''}" placeholder="Empresa" class="w-full text-xs p-1 border rounded bg-white">
          <div class="flex gap-1">
            <input type="text" id="editPatente-${o.id}" value="${o.patente || ''}" placeholder="Patente" class="w-1/2 text-xs p-1 border rounded bg-white font-bold uppercase">
            <input type="text" id="editMarca-${o.id}" value="${o.marca || ''}" placeholder="Marca/Modelo" class="w-1/2 text-xs p-1 border rounded bg-white">
          </div>
        </td>
        <td class="px-2 py-2">
          <textarea id="editDetalle-${o.id}" rows="2" class="w-full text-xs p-1 border rounded bg-white resize-none">${o.detalle || ''}</textarea>
        </td>
        <td class="px-2 py-2">
          <input type="number" id="editNeto-${o.id}" value="${o.valor_neto || 0}" oninput="calcularIvaEnLinea(${o.id})" class="w-full text-xs p-1 border rounded bg-white font-bold">
        </td>
        <td class="px-2 py-2">
          <input type="number" id="editTotal-${o.id}" value="${o.valor_total || 0}" class="w-full text-xs p-1 border rounded bg-white font-bold text-emerald-700">
        </td>
        <td class="px-2 py-2">
          <select id="editMedioPago-${o.id}" class="w-full text-xs p-1 border rounded bg-white">
            <option value="Efectivo" ${o.medio_pago === 'Efectivo' ? 'selected' : ''}>Efectivo</option>
            <option value="Tarjeta" ${o.medio_pago === 'Tarjeta' ? 'selected' : ''}>Tarjeta</option>
            <option value="Transferencia" ${o.medio_pago === 'Transferencia' ? 'selected' : ''}>Transferencia</option>
          </select>
        </td>
        <td class="px-2 py-2 text-center">
          <div class="flex flex-col gap-1 items-center">
            <button onclick="guardarEdicionFila(${o.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-1 px-2 rounded transition">
              💾 Guardar
            </button>
            <button onclick="cancelarEdicionFila()" class="w-full bg-slate-300 hover:bg-slate-400 text-slate-700 text-xs font-bold py-1 px-2 rounded transition">
              ✖ Cancelar
            </button>
          </div>
        </td>
      `;
    }

    // --- 3. ACCIONES DE EDICIÓN EN LÍNEA ---
    function activarEdicionFila(id) {
      idEditandoActualmente = id;
      cargarRegistros();
    }

    function cancelarEdicionFila() {
      idEditandoActualmente = null;
      cargarRegistros();
    }

    function calcularIvaEnLinea(id) {
      const neto = parseFloat(document.getElementById(`editNeto-${id}`).value) || 0;
      document.getElementById(`editTotal-${id}`).value = Math.round(neto * 1.19);
    }

    async function guardarEdicionFila(id) {
      const datosActualizados = {
        nombre_empresa: document.getElementById(`editEmpresa-${id}`).value.trim(),
        patente: document.getElementById(`editPatente-${id}`).value.trim().toUpperCase(),
        marca: document.getElementById(`editMarca-${id}`).value.trim(),
        detalle: document.getElementById(`editDetalle-${id}`).value.trim(),
        valor_neto: parseFloat(document.getElementById(`editNeto-${id}`).value) || 0,
        valor_total: parseFloat(document.getElementById(`editTotal-${id}`).value) || 0,
        medio_pago: document.getElementById(`editMedioPago-${id}`).value
      };

      const { data, error } = await client
        .from('ordenes')
        .update(datosActualizados)
        .eq('id', id)
        .select();

      if (error) {
        alert('Error al actualizar: ' + error.message);
      } else {
        idEditandoActualmente = null;
        cargarRegistros();
      }
    }

    // --- 4. ELIMINAR Y EXPORTAR ---
    async function eliminarRegistro(id) {
      if (!confirm(`¿Está seguro de que desea eliminar la orden #${id}?`)) return;

      const { error } = await client.from('ordenes').delete().eq('id', id);

      if (error) {
        alert('Error al eliminar: ' + error.message);
      } else {
        cargarRegistros();
      }
    }

    async function exportarExcel() {
      const { data: ordenes, error } = await client.from('ordenes').select('*').order('id', { ascending: false });

      if (error) return alert('Error al obtener datos.');

      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += "Folio;Fecha;Empresa;Marca;Patente;Detalle;Neto;Total;Medio Pago\n";

      ordenes.forEach(o => {
        const fecha = o.created_at ? new Date(o.created_at.split('T')[0] + 'T00:00:00').toLocaleDateString('es-CL') : 'N/A';
        csvContent += `${o.id};${fecha};"${o.nombre_empresa}";"${o.marca}";"${o.patente}";"${o.detalle || ''}";${o.valor_neto || 0};${o.valor_total || 0};"${o.medio_pago}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Ordenes_Trabajo_${new Date().toLocaleDateString('es-CL')}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // --- 5. NOTIFICACIONES Y REALTIME MEJORADO ---
    function reproducirSonidoNotificacion() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {
        console.log("Audio no permitido aún");
      }
    }

    function mostrarToastNuevoVale(vale) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "pointer-events-auto bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 flex items-center space-x-3 transition-all transform translate-y-5 opacity-0 duration-300";
      
      toast.innerHTML = `
        <div class="bg-emerald-500/20 text-emerald-400 p-2 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
        </div>
        <div>
          <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-400">¡Nuevo Vale Registrado!</h4>
          <p class="text-xs text-slate-300">Vale #${vale.id} - Patente: <span class="font-bold text-white">${vale.patente || 'S/N'}</span></p>
        </div>
      `;

      container.appendChild(toast);
      setTimeout(() => toast.classList.remove("translate-y-5", "opacity-0"), 50);
      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // SUSCRIPCIÓN EN TIEMPO REAL
    client
      .channel('cambios-vales-admin')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ordenes' }, (payload) => {
        console.log('Cambio detectado en tiempo real:', payload);

        if (payload.eventType === 'INSERT') {
          idNuevoValeReciente = payload.new.id; // Marcar ID del vale recién ingresado
          reproducirSonidoNotificacion();
          mostrarToastNuevoVale(payload.new);
        }

        cargarRegistros();
      })
      .subscribe((status) => {
        console.log('Estado Realtime Admin:', status);
      });
  </script>
</body>
</html>
